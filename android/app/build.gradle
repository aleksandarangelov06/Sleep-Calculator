plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing credentials, kept out of the repo (see ../README.md).
// Absent on a fresh clone, in which case only debug builds are possible.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.alekstudios.sleepcalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.alekstudios.sleepcalculator"
        minSdk 26
        targetSdk 34
        // versionCode must increase on every published build; versionName is
        // the human one, kept in step with "Version" in the Settings footer.
        // Same scheme as Alek Weather: 1.1 -> 11, 1.2 -> 12.
        versionCode 11
        versionName "1.1"

        // The UI is the bundled web page, in English; drop the library strings
        // shipped for ~85 other languages that the page never shows.
        resourceConfigurations += ['en']
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to unsigned if keystore.properties is missing, rather
            // than silently producing a debug-signed "release".
            signingConfig keystoreProps['storeFile'] ? signingConfigs.release : null
            // Shrinks the androidx library code; the JS bridge is pinned by
            // name in proguard-rules.pro so R8 leaves it alone.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // WebViewAssetLoader: serves the bundled web app over a real https origin
    // instead of file://, so localStorage behaves like it does on the website.
    implementation 'androidx.webkit:webkit:1.10.0'
}
